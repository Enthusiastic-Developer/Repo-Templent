name: Auto-Move Issues in GitHub Project

on:
  issues:
    types: [labeled, assigned, closed]

permissions:
  issues: write
  repository-projects: write

jobs:
  move_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue in GitHub Project
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectId = "PVT_kwDOBJnNB84Azg24";  // Correct Project ID
            const fieldId = "PVTSSF_lADOBJnNB84Azg24zgpSx9w";  // Status Field ID
            const issueNodeId = context.payload.issue.node_id;

            const statusMap = {
              "Status: Awaiting Review": "15d1b641",  // Review
              "Status: WIP": "520c7b3b",  // In Progress
              "Status: Completed": "9369703c",  // Completed
              "Status: Stale": "e36c32bc",  // Backlog
              "Status: Waiting": "e36c32bc",  // Backlog
              "Priority: Urgent": "99581684"  // To Do
            };

            const labels = context.payload.issue.labels.map(label => label.name);
            let newStatus = "e36c32bc";  // Default to Backlog

            for (const [label, statusId] of Object.entries(statusMap)) {
              if (labels.includes(label)) {
                newStatus = statusId;
                break;
              }
            }

            // If issue is assigned, move to "In Progress"
            if (context.payload.issue.assignee) {
              newStatus = "520c7b3b";
            }

            // If issue is closed, move to "Completed"
            if (context.payload.issue.state === "closed") {
              newStatus = "9369703c";
            }

            console.log(`Moving issue #${context.payload.issue.number} to Status ID ${newStatus}`);

            const mutation = `
              mutation {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: "${projectId}"
                    itemId: "${issueNodeId}"
                    fieldId: "${fieldId}"
                    value: { singleSelectOptionId: "${newStatus}" }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(mutation);
