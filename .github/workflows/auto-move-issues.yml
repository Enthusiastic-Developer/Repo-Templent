name: Auto-Move Issues in GitHub Project

on:
  issues:
    types: [labeled, assigned, closed]

permissions:
  issues: write
  repository-projects: write

jobs:
  move_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue in GitHub Project
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT_GITHUB_PROJECTS }}  # Use the Personal Access Token
          script: |
            const projectId = "PVT_kwDOBJnNB84Azg24";  // Correct Project ID
            const fieldId = "PVTSSF_lADOBJnNB84Azg24zgpSx9w";  // Status Field ID
            const issueNodeId = context.payload.issue.node_id;

            const statusMap = {
              "Status: Awaiting Review": "15d1b641",  // Review
              "Status: WIP": "520c7b3b",  // In Progress
              "Status: Completed": "9369703c",  // Completed
              "Status: Stale": "e36c32bc",  // Backlog
              "Status: Waiting": "e36c32bc",  // Backlog
              "Priority: Urgent": "99581684"  // To Do
            };

            const labels = context.payload.issue.labels.map(label => label.name);
            let newStatus = "e36c32bc";  // Default to Backlog

            for (const [label, statusId] of Object.entries(statusMap)) {
              if (labels.includes(label)) {
                newStatus = statusId;
                break;
              }
            }

            // If issue is assigned, move to "In Progress"
            if (context.payload.issue.assignee) {
              newStatus = "520c7b3b";
            }

            // If issue is closed, move to "Completed"
            if (context.payload.issue.state === "closed") {
              newStatus = "9369703c";
            }

            // Prevent running on newly created issues (avoids duplicate runs)
            const issueCreatedAt = new Date(context.payload.issue.created_at);
            const now = new Date();
            const timeDifference = (now - issueCreatedAt) / 1000;  // Convert to seconds

            if (timeDifference < 10) {
              console.log("Skipping issue movement as it's a newly created issue.");
              return;
            }

            console.log(`Processing issue #${context.payload.issue.number} - trying to move to Status ID ${newStatus}`);

            // First, check if the issue is already in the project
            const findItemQuery = `
              query {
                node(id: "${projectId}") {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const projectData = await github.graphql(findItemQuery);
              const projectItems = projectData.node.items.nodes;
              
              // Find the item that corresponds to our issue
              let projectItemId = null;
              for (const item of projectItems) {
                if (item.content && item.content.id === issueNodeId) {
                  projectItemId = item.id;
                  break;
                }
              }
              
              // If the issue isn't in the project yet, add it first
              if (!projectItemId) {
                console.log(`Adding issue #${context.payload.issue.number} to project`);
                const addMutation = `
                  mutation {
                    addProjectV2ItemById(input: {
                      projectId: "${projectId}"
                      contentId: "${issueNodeId}"
                    }) {
                      item {
                        id
                      }
                    }
                  }
                `;
                
                const addResult = await github.graphql(addMutation);
                projectItemId = addResult.addProjectV2ItemById.item.id;
                console.log(`Added issue to project, got project item ID: ${projectItemId}`);
              } else {
                console.log(`Found existing project item ID: ${projectItemId}`);
              }
              
              // Now update the status using the project item ID
              console.log(`Moving issue #${context.payload.issue.number} to Status ID ${newStatus}`);
              const updateMutation = `
                mutation {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: "${projectId}"
                      itemId: "${projectItemId}"
                      fieldId: "${fieldId}"
                      value: { singleSelectOptionId: "${newStatus}" }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;
              
              await github.graphql(updateMutation);
              console.log(`Successfully updated issue status in project`);
              
            } catch (error) {
              console.error(`Error processing issue: ${error.message}`);
              console.error(JSON.stringify(error, null, 2));
              throw error;
            }