name: AI Issue Classifier

on:
  issues:
    types: [opened]

permissions:
  issues: write # Ensure the workflow can modify issues

jobs:
  classify_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install axios @actions/core @actions/github

      - name: Analyze Issue with Gemini API
        run: node .github/scripts/classify-issue.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
