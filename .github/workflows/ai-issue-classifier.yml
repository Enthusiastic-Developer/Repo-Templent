name: AI Issue Classifier

on:
  issues:
    types: [opened]

jobs:
  classify_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Analyze Issue with OpenAI
        id: classify
        uses: actions/github-script@v6
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const axios = require('axios');
            const response = await axios.post('https://api.openai.com/v1/chat/completions', {
              model: "gpt-4",
              messages: [{role: "system", content: "Classify the following GitHub issue into one of these categories: bug, feature request, documentation, security, performance, chore."}, {role: "user", content: issueBody}]
            }, {
              headers: {
                'Authorization': `Bearer ${{ secrets.OPENAI_API_KEY }}`,
                'Content-Type': 'application/json'
              }
            });
            const classification = response.data.choices[0].message.content.trim().toLowerCase();
            core.setOutput('classification', classification);

      - name: Label Issue
        uses: actions/github-script@v6
        with:
          script: |
            const classification = "${{ steps.classify.outputs.classification }}";
            const issueNumber = context.payload.issue.number;
            const labels = {
              "bug": "Type: Bug",
              "feature request": "Type: Feature",
              "documentation": "Type: Documentation",
              "security": "Type: Security",
              "performance": "Type: Performance",
              "chore": "Type: Chore"
            };
            if (labels[classification]) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [labels[classification]]
              });
            }

      - name: Comment on Issue
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const classification = "${{ steps.classify.outputs.classification }}";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🤖 AI has classified this issue as **${classification}**. If this is incorrect, please update the labels manually.`
            });
            