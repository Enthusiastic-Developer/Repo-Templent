name: AI Issue Classifier

on:
  issues:
    types: [opened]

permissions:
  issues: write  # Ensures the workflow can modify issues

jobs:
  classify_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Analyze Issue with OpenAI
        id: classify
        uses: actions/github-script@v6
        with:
          script: |
            const issueBody = context.payload.issue.body || "No description provided.";

            try {
              console.log("Calling OpenAI API...");
              const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${{ secrets.OPENAI_API_KEY }}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "gpt-4",
                  messages: [
                    {role: "system", content: "Classify the following GitHub issue into one of these categories: bug, feature request, documentation, security, performance, chore."},
                    {role: "user", content: issueBody}
                  ]
                })
              });

              if (!response.ok) throw new Error(`API error: ${response.status} ${response.statusText}`);

              const data = await response.json();
              const classification = data.choices?.[0]?.message?.content?.trim().toLowerCase();
              console.log(`Classification: ${classification}`);

              const labelMap = {
                "bug": "Type: Bug",
                "feature request": "Type: Feature",
                "documentation": "Type: Documentation",
                "security": "Type: Security",
                "performance": "Type: Performance",
                "chore": "Type: Chore"
              };

              const finalLabel = labelMap[classification] || "Needs Review";
              console.log(`Final Label: ${finalLabel}`);

              core.setOutput('classification', finalLabel);
            } catch (error) {
              console.error("Error during AI classification:", error);
              core.setOutput('classification', "Needs Review");
            }

      - name: Label Issue
        uses: actions/github-script@v6
        with:
          script: |
            const classification = "${{ steps.classify.outputs.classification }}";
            const issueNumber = context.payload.issue.number;
            console.log(`Assigning label: ${classification} to issue #${issueNumber}`);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [classification]
            });

      - name: Comment on Issue
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const classification = "${{ steps.classify.outputs.classification }}";
            
            console.log(`Commenting on issue #${issueNumber} with classification: ${classification}`);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🤖 AI has classified this issue as **${classification}**. If this is incorrect, please update the labels manually.`
            });